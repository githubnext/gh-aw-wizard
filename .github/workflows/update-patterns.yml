name: Update pattern library

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pattern-library
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required secret
        id: check-token
        env:
          TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_AW_GITHUB_TOKEN secret is not set; skipping the pattern library scan and update. GitHub code search requires a user token (a PAT with public_repo scope) because the default GITHUB_TOKEN cannot access it."
          fi

      - name: Scan active workflows
        if: steps.check-token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: scripts/scan.sh --active-only --run-history

      - name: Generate patterns
        if: steps.check-token.outputs.has_token == 'true'
        run: python3 scripts/generate-patterns.py

      - name: Create or update pull request
        if: steps.check-token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/update-patterns
          PR_TITLE: "📊 Pattern library update"
        run: |
          if git diff --quiet -- patterns.json; then
            echo "patterns.json is unchanged; no pull request update is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add patterns.json
          git commit -m "Update pattern library"
          git push --force-with-lease origin "HEAD:$BRANCH"

          body="Automated weekly refresh of \`patterns.json\` from active agentic workflow data."
          pr_number="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body "$body"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "$PR_TITLE" --body "$body"
          fi
