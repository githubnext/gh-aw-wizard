name: WebLLM Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/web-llm-quality.yml"
      - "patterns/archetypes/**"
      - "patterns/manifest.json"
      - "package.json"
      - "playwright.quality.config.js"
      - "src/js/slm*.js"
      - "src/wizard.json"
      - "test/fixtures/web-llm-golden-intents.json"
      - "test/quality/web-llm-quality.spec.js"
      - "test/web-llm-golden.test.js"

permissions:
  contents: read

concurrency:
  group: web-llm-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_LLM_MODEL_ID: Qwen2.5-1.5B-Instruct-q4f32_1-MLC
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore WebLLM model weights
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/web-llm-cache
          key: web-llm-${{ runner.os }}-${{ env.WEB_LLM_MODEL_ID }}-${{ hashFiles('package-lock.json', 'scripts/fetch-vendor-assets.mjs', 'src/wizard.json') }}

      - name: Evaluate WebLLM intent quality
        id: evaluation
        continue-on-error: true
        timeout-minutes: 15
        env:
          WEB_LLM_CACHE_DIR: ${{ runner.temp }}/web-llm-cache
        run: npm run test:web-llm-quality

      - name: Save WebLLM model weights
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/web-llm-cache
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - name: Report quality summary
        if: always()
        run: |
          if [ -f test-results/web-llm-quality/summary.md ]; then
            cat test-results/web-llm-quality/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WebLLM quality evaluation did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-llm-quality-${{ github.run_id }}
          path: test-results/web-llm-quality/
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate evaluation failure
        if: always() && steps.evaluation.outcome == 'failure'
        run: exit 1
